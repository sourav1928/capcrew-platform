# Saved as /etc/nginx/snippets/capcrew-proxy.conf. How nginx talks to the Django app.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# IMPORTANT: this REPLACES any X-Forwarded-For sent by the visitor, so nobody can fake their address
# to get around the login limits. It matches NUM_PROXIES=1 in backend/.env.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 30s;
