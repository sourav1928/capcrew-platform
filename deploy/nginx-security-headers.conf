# Shared security headers. Saved as /etc/nginx/snippets/capcrew-security-headers.conf
# Included by every server block (and again inside any location that sets its own add_header,
# because nginx drops inherited headers there).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
